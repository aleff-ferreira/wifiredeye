# 2-vCPU / 7.8 GiB RAM / 0-Byte Swap Safety Caps + 2-CA TLS Truststore + XFS tmpdir
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/home/antigravity/.tmp -Djavax.net.ssl.trustStore=/home/antigravity/.android-sdk/cacerts.p12 -Djavax.net.ssl.trustStorePassword=changeit
kotlin.daemon.jvmargs=-Xmx1536m -Djava.io.tmpdir=/home/antigravity/.tmp -Djavax.net.ssl.trustStore=/home/antigravity/.android-sdk/cacerts.p12 -Djavax.net.ssl.trustStorePassword=changeit
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.kotlin.dsl.skipMetadataVersionCheck=true

# AndroidX & Non-Transitive R Classes
android.useAndroidX=true
android.nonTransitiveRClass=true
